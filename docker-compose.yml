services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hifazat
      POSTGRES_PASSWORD: hifazat
      POSTGRES_DB: hifazat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hifazat"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://hifazat:hifazat@db:5432/hifazat
      JWT_SECRET: ${JWT_SECRET:-change-me-for-local-docker-only}
      FRONTEND_ORIGIN: http://localhost:8000
      DEBUG: "false"
    ports:
      - "8000:8000"

volumes:
  pgdata:
